<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": {{ site.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }}
  }
}
</script>
