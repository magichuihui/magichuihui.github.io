<div id="terminal-overlay">
  <div class="terminal-wrapper fullscreen">
    <div class="terminal-titlebar">
      <div class="terminal-dots">
        <span class="terminal-dot red" id="term-dot-close"></span>
        <span class="terminal-dot amber"></span>
        <span class="terminal-dot green"></span>
      </div>
      <span class="terminal-title">guest@kyraos:~/home — bash</span>
      <span class="terminal-exit-btn" id="terminal-exit-btn" title="Exit to normal view (or type 'exit')">⏻</span>
    </div>
    <div id="terminal-screen" class="terminal-screen">
      <div class="terminal-line dim">Starting terminal...</div>
    </div>
    <div class="terminal-input-line" id="terminal-input-line">
      <span class="terminal-prompt">guest@kyraos:~$</span>
      <input type="text" id="terminal-input" class="terminal-input" autofocus spellcheck="false" autocomplete="off" aria-label="Terminal input" />
    </div>
  </div>
</div>

<button id="terminal-return-btn" class="terminal-return-btn" title="Switch to terminal mode">🖥 Terminal</button>

<script>
window._terminalPosts = [
  {% for post in site.posts limit:50 %}
  { title: {{ post.title | jsonify }}, url: {{ post.url | relative_url | jsonify }}, date: {{ post.date | date: "%Y-%m-%d" | jsonify }}, tags: {{ post.tags | jsonify }} }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
window._terminalTags = [
  {% assign all_tags = site.tags | sort %}
  {% for tag in all_tags %}
  {{ tag[0] | jsonify }}{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
window._terminalSite = {
  title: {{ site.title | jsonify }},
  subtitle: {{ page.subtitle | default: site.description | jsonify }},
  url: {{ '/' | absolute_url | jsonify }},
  author: {{ site.author | jsonify }}
};
</script>

<noscript>
  <div style="background:#fff;padding:2rem;text-align:center;font-family:sans-serif">
    <p>Please enable JavaScript for the terminal experience, or scroll down to view the blog normally.</p>
  </div>
</noscript>
